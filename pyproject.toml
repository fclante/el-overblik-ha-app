[project]
name = "eloverblik-data"
version = "0.1.0"
description = "Read-only ElOverblik Customer API integration for Home Assistant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
dependencies = []

[project.urls]
Documentation = "https://github.com/fclante/el-overblik-ha-app#readme"
Issues = "https://github.com/fclante/el-overblik-ha-app/issues"
Source = "https://github.com/fclante/el-overblik-ha-app"
Changelog = "https://github.com/fclante/el-overblik-ha-app/releases"

[dependency-groups]
dev = [
  "homeassistant==2026.11.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-aiohttp==1.1.1",
  "ruff>=0.14",
  "mypy>=1.18",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
