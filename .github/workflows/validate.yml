name: Validate
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/check
      - name: Build validation ZIP
        if: github.ref != 'refs/heads/main'
        run: uv run python scripts/release.py build --output "$RUNNER_TEMP/validated-dist"
      - name: Upload validation ZIP (not a release)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-zip-${{ github.sha }}
          path: |
            ${{ runner.temp }}/validated-dist/eloverblik_data.zip
            ${{ runner.temp }}/validated-dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2 # official HACS action
        env:
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          github_token: ${{ github.token }}
          comment: "false"
